<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roteiros do João Pedro</title>
<meta name="theme-color" content="#101114">
<link rel="icon" type="image/svg+xml" href="foca.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Roteiros JP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101114; --card:#1a1c21; --card2:#22252b; --line:#2c3038;
    --txt:#f2f3f5; --muted:#9097a3; --acc:#ffb020; --acc-txt:#1a1200; --ok:#3ecf8e;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif}
  body{min-height:100dvh}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
  .logo{width:56px;height:56px;border-radius:14px;display:block;margin-bottom:10px}
  header h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
  header p{margin:0;color:var(--muted);font-size:15px}
  .search{margin:20px 0 14px;position:relative}
  .search input{width:100%;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:16px;outline:none}
  .search input:focus{border-color:var(--acc)}
  .count{color:var(--muted);font-size:13px;margin:0 2px 10px}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
  .item:active{transform:scale(.99)}
  .item:hover{border-color:#3a3f49}
  .num{flex:0 0 40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--acc);font-size:15px}
  .meta{flex:1;min-width:0}
  .meta b{display:block;font-size:16px;font-weight:600;line-height:1.3}
  .meta span{display:block;color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{color:var(--muted);font-size:20px}
  .empty{padding:28px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;line-height:1.55;font-size:15px}
  .empty code{background:var(--card2);padding:2px 6px;border-radius:6px;color:var(--txt)}

  /* leitor */
  .reader{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
  .reader.on{display:flex}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
  .back{background:var(--card);border:1px solid var(--line);color:var(--txt);width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;flex:0 0 auto}
  .rtitle{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .copy{background:var(--acc);color:var(--acc-txt);border:0;height:44px;padding:0 18px;border-radius:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;flex:0 0 auto}
  .copy.done{background:var(--ok);color:#00230f}
  .frame{flex:1;width:100%;border:0;background:#fff}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ok);color:#00230f;font-weight:700;padding:12px 18px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="wrap" id="home">
  <header>
    <img class="logo" src="foca.svg" alt="">
    <h1>Roteiros do João Pedro</h1>
    <p>Toca no roteiro pra abrir. Lá dentro tem o botão de copiar.</p>
  </header>
  <div class="search"><input id="q" type="search" placeholder="Buscar roteiro" autocomplete="off"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"><div class="empty">Carregando roteiros...</div></div>
</div>

<div class="reader" id="reader">
  <div class="bar">
    <button class="back" id="back" aria-label="Voltar">&#8592;</button>
    <div class="rtitle" id="rtitle"></div>
    <button class="copy" id="copy">Copiar</button>
  </div>
  <iframe class="frame" id="frame" title="Roteiro"></iframe>
</div>

<div class="toast" id="toast">Roteiro copiado</div>

<script>
const OWNER = 'horisawa-ai', REPO = 'joaopedro', PASTA = 'roteiros';
let roteiros = [];

const $ = id => document.getElementById(id);
const nomeBonito = f => f.replace(/\.html?$/i,'').replace(/^\d+[\s._-]*/,'').replace(/[-_]+/g,' ').trim() || f;
const natural = (a,b) => a.arquivo.localeCompare(b.arquivo, 'pt-BR', {numeric:true, sensitivity:'base'});

async function carregarLista(){
  let arquivos = [];
  try{
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PASTA}?ref=main`, {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      arquivos = j.filter(x => x.type==='file' && /\.html?$/i.test(x.name)).map(x => x.name);
    }
  }catch(e){}
  if(!arquivos.length){
    try{
      const r = await fetch(`${PASTA}/lista.json`, {cache:'no-store'});
      if(r.ok) arquivos = await r.json();
    }catch(e){}
  }
  roteiros = arquivos.map(a => ({arquivo:a, titulo:nomeBonito(a), resumo:''})).sort(natural);
  render();
  // pega titulo e primeira linha de cada arquivo
  await Promise.all(roteiros.map(async it => {
    try{
      const r = await fetch(`${PASTA}/${encodeURIComponent(it.arquivo)}`, {cache:'no-store'});
      if(!r.ok) return;
      const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
      const t = (doc.querySelector('title')?.textContent || doc.querySelector('h1')?.textContent || '').trim();
      if(t) it.titulo = t;
      doc.querySelectorAll('script,style,title,h1').forEach(n => n.remove());
      doc.querySelectorAll('p,div,li,h2,h3,h4,pre,br,td').forEach(n => n.append(' '));
      it.resumo = (doc.body?.textContent || '').replace(/\s+/g,' ').trim().slice(0,120);
    }catch(e){}
  }));
  render();
  abrirPeloHash();
}

function render(){
  const q = $('q').value.trim().toLowerCase();
  const vis = roteiros.filter(r => !q || (r.titulo+' '+r.resumo+' '+r.arquivo).toLowerCase().includes(q));
  $('count').textContent = roteiros.length ? `${vis.length} de ${roteiros.length} roteiro${roteiros.length>1?'s':''}` : '';
  const list = $('list');
  if(!roteiros.length){
    list.innerHTML = `<div class="empty">Nenhum roteiro ainda.<br>Os arquivos HTML que entrarem na pasta <code>${PASTA}/</code> aparecem aqui sozinhos.</div>`;
    return;
  }
  if(!vis.length){ list.innerHTML = `<div class="empty">Nada encontrado com essa busca.</div>`; return; }
  list.innerHTML = '';
  vis.forEach(r => {
    const i = roteiros.indexOf(r) + 1;
    const b = document.createElement('button');
    b.className = 'item';
    b.innerHTML = `<div class="num">${i}</div><div class="meta"><b></b><span></span></div><div class="arrow">&#8250;</div>`;
    b.querySelector('b').textContent = r.titulo;
    b.querySelector('span').textContent = r.resumo || r.arquivo;
    b.onclick = () => { location.hash = 'r=' + encodeURIComponent(r.arquivo); };
    list.appendChild(b);
  });
}

function abrirPeloHash(){
  const m = location.hash.match(/^#r=(.+)$/);
  if(!m){ fecharLeitor(); return; }
  const arquivo = decodeURIComponent(m[1]);
  const r = roteiros.find(x => x.arquivo === arquivo) || {arquivo, titulo:nomeBonito(arquivo)};
  $('rtitle').textContent = r.titulo;
  $('frame').src = `${PASTA}/${encodeURIComponent(arquivo)}`;
  $('reader').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function fecharLeitor(){
  $('reader').classList.remove('on');
  $('frame').removeAttribute('src');
  document.body.style.overflow = '';
}

// coloca botao de copiar em cada bloco de codigo dentro do roteiro
$('frame').addEventListener('load', () => {
  let d; try{ d = $('frame').contentDocument; }catch(e){ return; }
  if(!d || !d.body) return;
  d.querySelectorAll('pre').forEach(pre => {
    if(pre.dataset.jpCopy) return;
    pre.dataset.jpCopy = '1';
    pre.style.position = 'relative';
    const b = d.createElement('button');
    b.textContent = 'copiar';
    b.style.cssText = 'position:absolute;top:8px;right:8px;background:#ffb020;color:#1a1200;border:0;border-radius:8px;padding:6px 10px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer';
    b.onclick = e => { e.stopPropagation(); copiar(pre.innerText.replace(/\ncopiar$/,'').replace(/^copiar\n?/,'')); };
    pre.appendChild(b);
  });
});

async function copiar(texto){
  texto = texto.replace(/\n{3,}/g,'\n\n').trim();
  try{ await navigator.clipboard.writeText(texto); }
  catch(e){
    const t = document.createElement('textarea');
    t.value = texto; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  const btn = $('copy'); btn.textContent = 'Copiado'; btn.classList.add('done');
  $('toast').classList.add('on');
  setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('done'); $('toast').classList.remove('on'); }, 1600);
}

$('copy').onclick = () => {
  let d; try{ d = $('frame').contentDocument; }catch(e){}
  if(!d || !d.body) return;
  const clone = d.body.cloneNode(true);
  clone.querySelectorAll('[data-jp-copy] > button').forEach(b => b.remove());
  // innerText respeita quebras de linha do jeito que aparece na tela
  const tmp = d.createElement('div');
  tmp.style.cssText = 'position:absolute;left:-99999px;top:0;white-space:normal';
  tmp.appendChild(clone);
  d.body.appendChild(tmp);
  const texto = tmp.innerText;
  tmp.remove();
  copiar(texto);
};
$('back').onclick = () => { history.length > 1 ? history.back() : (location.hash = ''); };
$('q').addEventListener('input', render);
window.addEventListener('hashchange', abrirPeloHash);
carregarLista();
</script>
</body>
</html>
